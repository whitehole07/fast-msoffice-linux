<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#16233d"/>
    </linearGradient>
    <linearGradient id="body" x1="0.25" y1="0" x2="0.8" y2="1">
      <stop offset="0%"  stop-color="#334155"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="speed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g>
    <rect x="30" y="212" width="96"  height="12" rx="6" fill="url(#speed)" opacity="0.85"/>
    <rect x="14" y="258" width="126" height="12" rx="6" fill="url(#speed)"/>
    <rect x="38" y="304" width="84"  height="12" rx="6" fill="url(#speed)" opacity="0.6"/>
  </g>

  <g filter="url(#soft)">
    <!-- feet -->
    <path d="M212 402c26-6 44 4 46 22 1 12-14 18-36 18-24 0-40-8-40-20 0-10 12-16 30-20z" fill="url(#beak)"/>
    <path d="M300 402c-26-6-44 4-46 22-1 12 14 18 36 18 24 0 40-8 40-20 0-10-12-16-30-20z" fill="url(#beak)"/>

    <!-- flippers, behind the body -->
    <ellipse cx="150" cy="300" rx="30" ry="76" transform="rotate(14 150 300)" fill="#0f172a"/>
    <ellipse cx="362" cy="300" rx="30" ry="76" transform="rotate(-14 362 300)" fill="#0f172a"/>

    <!-- body: narrow at the head, heavy at the base -->
    <path d="M256 78c62 0 104 50 108 118 3 44 14 66 14 106 0 68-54 114-122 114S134 370 134 302
             c0-40 11-62 14-106C152 128 194 78 256 78z" fill="url(#body)"/>

    <!-- belly window: small enough that the penguin still reads -->
    <g>
      <rect x="192" y="252" width="128" height="122" rx="20" fill="#f8fafc"/>
      <rect x="192" y="252" width="128" height="28" rx="14" fill="url(#hdr)"/>
      <rect x="192" y="266" width="128" height="14" fill="url(#hdr)"/>
      <circle cx="206" cy="266" r="4.5" fill="#f8fafc" opacity="0.95"/>
      <circle cx="220" cy="266" r="4.5" fill="#f8fafc" opacity="0.7"/>

      <rect x="206" y="294" width="58" height="8" rx="4" fill="#94a3b8"/>
      <rect x="206" y="310" width="40" height="8" rx="4" fill="#cbd5e1"/>

      <rect x="208" y="344" width="16" height="18" rx="3" fill="#38bdf8"/>
      <rect x="230" y="332" width="16" height="30" rx="3" fill="#818cf8"/>
      <rect x="252" y="338" width="16" height="24" rx="3" fill="#22c55e"/>
      <rect x="274" y="326" width="16" height="36" rx="3" fill="#7dd3fc"/>
    </g>

    <!-- eyes: small and close-set, so it looks alert rather than startled -->
    <ellipse cx="232" cy="150" rx="20" ry="23" fill="#f8fafc"/>
    <ellipse cx="280" cy="150" rx="20" ry="23" fill="#f8fafc"/>
    <circle cx="238" cy="153" r="9" fill="#0b1220"/>
    <circle cx="286" cy="153" r="9" fill="#0b1220"/>

    <!-- beak -->
    <path d="M256 176c17 0 29 9 29 18s-13 15-29 15-29-6-29-15 12-18 29-18z" fill="url(#beak)"/>
  </g>
</svg>
